[platformio]
src_dir = firmware/esp32

; RetroPicto — ESP32 Nintendo DS / PictoChat firmware
; PlatformIO project using the ESP-IDF framework.
;
; Build:   pio run
; Flash:   pio run -t upload
; Serial:  pio device monitor
;
; ESP-IDF Kconfig options live in sdkconfig.defaults (PlatformIO honors it).

; The sniffer mode is chosen per-board via a build flag so the two boards can
; run different firmware from one source tree:
;   SNIFFER_MODE=1  MODE_STREAM    (WROOM, the PCAP-over-UDP sniffer)
;   SNIFFER_MODE=2  MODE_JOIN      (C6, impersonates a joiner + injects)

[env]
; ESP-IDF component CMake compiles the portable library once.
lib_ldf_mode = off

[env:esp32dev]
platform = espressif32
board = esp32dev            ; generic ESP32-WROOM dev board — the sniffer
framework = espidf
monitor_speed = 115200
build_flags = -D SNIFFER_MODE=1

[env:esp32c6]
; Preserve the joiner's original 100 Hz tick without checking in generated sdkconfig.
board_build.cmake_extra_args = "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;firmware/esp32/sdkconfig.tick100"
platform = espressif32
board = esp32-c6-devkitc-1  ; ESP32-C6 — the joiner / injector
framework = espidf
monitor_speed = 115200
; -zmuldefs lets our ieee80211_raw_frame_sanity_check() override the driver's,
; so esp_wifi_80211_tx() will transmit auth/assoc management frames.
build_flags = -D SNIFFER_MODE=2 -Wl,-zmuldefs

[env:esp32dev_disc]
board_build.cmake_extra_args = "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;firmware/esp32/sdkconfig.tick100"
platform = espressif32
board = esp32dev            ; WROOM as a channel-hopping serial sniffer (radiation check)
framework = espidf
monitor_speed = 115200
build_flags = -D SNIFFER_MODE=0

[env:esp32dev_serial]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
; C6-targeted diagnostics for the admission experiment. Add
; -D SERIAL_TRACE_JORDAN=1 to capture Jordan hosting Ash instead.
build_flags = -D SNIFFER_MODE=4

[env:esp32c6host]
platform = espressif32
board = esp32-c6-devkitc-1  ; ESP32-C6 — MODE_HOST (we host, a DS joins us)
framework = espidf
monitor_speed = 115200
build_flags = -D SNIFFER_MODE=3 -Wl,-zmuldefs -Wl,--wrap=hal_mac_tx_set_ppdu -Wl,--wrap=hal_mac_tx_config_edca

; Local virtual-member experiment: three physical clients plus GHOST and host.
[env:esp32c6ghost]
extends = env:esp32c6host
build_flags = ${env:esp32c6host.build_flags} -D PICTOCHAT_GHOST_DEMO=1

; Both boards use one image; factory MACs in wifi.local.json select room A/B.
[env:esp32c6online]
extends = env:esp32c6host
extra_scripts = pre:tools/wifi_credentials.py
build_flags = ${env:esp32c6host.build_flags} -D PICTOCHAT_ONLINE=1 -Wl,--wrap=ieee80211_add_dsparams

; USB-connected room hosts: A/channel 1 and B/channel 7, PC carries relay traffic.
[env:esp32c6usb]
extends = env:esp32c6host
build_flags = ${env:esp32c6host.build_flags} -D PICTOCHAT_ONLINE=1 -D PICTOCHAT_USB=1 -Wl,--wrap=ieee80211_add_dsparams

; BLE carries relay packets to a PC/phone; Wi-Fi stays dedicated to PictoChat.
[env:esp32c6ble]
extends = env:esp32c6host
board_build.partitions = firmware/esp32/partitions.ble.csv
board_build.cmake_extra_args = "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;firmware/esp32/sdkconfig.ble"
build_flags = ${env:esp32c6host.build_flags} -D PICTOCHAT_ONLINE=1 -D PICTOCHAT_BLE=1 -Wl,--wrap=ieee80211_add_dsparams

; Distributable BLE targets. Explicit A/B roles work with replacement boards
; without editing factory MAC addresses. Always upload the matching chip image.
; Pin the SDK platform: private radio hooks are sensitive to SDK changes.
[multihop]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = espidf
monitor_speed = 115200
board_build.partitions = firmware/esp32/partitions.ble.csv
board_build.cmake_extra_args = "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;firmware/esp32/sdkconfig.ble"
build_flags = -D SNIFFER_MODE=3 -D PICTOCHAT_ONLINE=1 -D PICTOCHAT_BLE=1 -Wl,-zmuldefs -Wl,--wrap=ieee80211_add_dsparams

[env:multihop_c6_a]
extends = multihop
board = esp32-c6-devkitc-1
build_flags = ${multihop.build_flags} -D PICTOCHAT_NODE=1 -Wl,--wrap=hal_mac_tx_set_ppdu -Wl,--wrap=hal_mac_tx_config_edca

[env:multihop_c6_b]
extends = env:multihop_c6_a
build_flags = ${multihop.build_flags} -D PICTOCHAT_NODE=2 -Wl,--wrap=hal_mac_tx_set_ppdu -Wl,--wrap=hal_mac_tx_config_edca

; Experimental ports: compilation does not establish DS radio interoperability.
[env:multihop_s3_a]
extends = multihop
board = esp32-s3-devkitc-1
build_flags = ${multihop.build_flags} -D PICTOCHAT_NODE=1

[env:multihop_s3_b]
extends = env:multihop_s3_a
build_flags = ${multihop.build_flags} -D PICTOCHAT_NODE=2

[env:multihop_esp32_a]
extends = multihop
board = esp32dev
build_flags = ${multihop.build_flags} -D PICTOCHAT_NODE=1

[env:multihop_esp32_b]
extends = env:multihop_esp32_a
build_flags = ${multihop.build_flags} -D PICTOCHAT_NODE=2
