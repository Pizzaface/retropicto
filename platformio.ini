[platformio]
src_dir = firmware/esp32

; RetroPicto — ESP32 Nintendo DS / PictoChat firmware (ESP-IDF via PlatformIO).
; No default_envs: a bare `pio run` builds every environment. Pick one:
;
; Build:   pio run -e esp32c6usb                  (production image)
; Flash:   pio run -e esp32dev_disc -t upload     (any env)
; Serial:  pio device monitor
;
; SNIFFER_MODE and other compile-time defaults live in firmware/esp32/firmware_config.h;
; ESP-IDF Kconfig options live in sdkconfig.defaults.

[env]
; Pin the SDK platform: private radio hooks are sensitive to SDK changes.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = espidf
monitor_speed = 115200
; ESP-IDF component CMake compiles the portable library once.
lib_ldf_mode = off

[env:esp32dev]
board = esp32dev            ; generic ESP32-WROOM dev board — PCAP-over-UDP sniffer
build_flags = -D SNIFFER_MODE=1

[env:esp32dev_disc]
board_build.cmake_extra_args = "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;firmware/esp32/sdkconfig.tick100"
board = esp32dev            ; WROOM as a channel-hopping serial sniffer (radiation check)
build_flags = -D SNIFFER_MODE=0

[env:esp32dev_serial]
board = esp32dev
; C6-targeted diagnostics for the admission experiment. Add
; -D SERIAL_TRACE_JORDAN=1 to capture Jordan hosting Ash instead.
build_flags = -D SNIFFER_MODE=4

; Passive WROOM witness for the B/channel-7 echo trial; no AP or relay.
[env:sniffer_b]
extends = env:esp32dev_serial
build_flags = ${env:esp32dev_serial.build_flags} -D CAPTURE_CHANNEL=7

; Bounded bidirectional drawing witness with ACK/empty-reply timing on D/channel 7.
[env:sniffer_d_transfer]
extends = env:sniffer_b
monitor_speed = 921600
upload_speed = 115200
board_build.cmake_extra_args = "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;firmware/esp32/sdkconfig.capture"
build_flags = ${env:sniffer_b.build_flags} -D MP_TRACE_APP_FRAMES=8192 -D MP_TRACE_FRAMES=65536

[env:esp32c6host]
board = esp32-c6-devkitc-1  ; ESP32-C6 — MODE_HOST (we host, a DS joins us)
; -zmuldefs lets our ieee80211_raw_frame_sanity_check() override the driver's.
build_flags = -D SNIFFER_MODE=3 -Wl,-zmuldefs -Wl,--wrap=hal_mac_tx_set_ppdu -Wl,--wrap=hal_mac_tx_config_edca

; Standalone drawing-echo bench builds, one per hardware-confirmed room/channel pair.
[env:echo_a]
extends = env:esp32c6host
build_flags = ${env:esp32c6host.build_flags} -D HOST_CHATROOM=0 -D CAPTURE_CHANNEL=1

[env:echo_b]
extends = env:echo_a
build_flags = ${env:esp32c6host.build_flags} -D HOST_CHATROOM=1

[env:echo_c]
extends = env:echo_a
build_flags = ${env:esp32c6host.build_flags} -D HOST_CHATROOM=2 -D CAPTURE_CHANNEL=13

[env:echo_d]
extends = env:echo_a
build_flags = ${env:esp32c6host.build_flags} -D HOST_CHATROOM=3

; Local virtual-member experiment: three physical clients plus GHOST and host.
[env:esp32c6ghost]
extends = env:esp32c6host
build_flags = ${env:esp32c6host.build_flags} -D PICTOCHAT_GHOST_DEMO=1

; PRODUCTION: USB room host. The Android app carries relay traffic to the MLS server;
; the room letter (A-D) is saved in NVS over USB.
[env:esp32c6usb]
extends = env:esp32c6host
; 4 MB header boots on both 4 MB and 8 MB C6 modules; the app/web flashers write this image verbatim (no esptool header patching).
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; PICTOCHAT_ROOM_CLIENTS = local DS slots (ONLINE_LOCAL_SLOTS) + remote ghosts; ~24 KB RAM per slot.
; Ceiling is set by heap and DS poll timing: raise on hardware until it stops working, then back off.
build_flags = ${env:esp32c6host.build_flags} -D PICTOCHAT_ONLINE=1 -D PICTOCHAT_USB=1 -D PICTOCHAT_ROOM_CLIENTS=6u -D ONLINE_LOCAL_SLOTS=2u -Wl,--wrap=ieee80211_add_dsparams
